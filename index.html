<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Piano Allenamento · Marco</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@600;700;800&display=swap');
:root{
  --ink:#1a1208;--ink2:#4a3f30;--ink3:#8a7a60;
  --paper:#ffffff;--paper2:#fafafa;
  --line:#d4e4f0;--margin:#ffb3b3;
  --green:#276b2a;--green-l:#eaf5ea;
  --orange:#c94a00;--orange-l:#fff0e6;
  --blue:#1a4e8a;--blue-l:#e8f0ff;
  --purple:#5b1285;--purple-l:#f5eaff;
  --gray:#6b6b6b;--gray-l:#f0f0f0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Patrick Hand',cursive;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.5}

/* RULED BACKGROUND */
.ruled-bg{
  background-image:linear-gradient(var(--line) 1px,transparent 1px);
  background-size:100% 32px;
  background-position:0 31px;
}

/* SPLASH */
#splash{position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:200;padding:40px 28px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px);
  background-size:100% 32px;
  transition:opacity .4s ease,visibility .4s ease}
#splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
.splash-margin{position:absolute;left:44px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.6}
.splash-spine{position:absolute;top:0;left:0;right:0;height:10px;
  background:repeating-linear-gradient(90deg,#cc3333 0,#cc3333 7px,transparent 7px,transparent 22px)}
.splash-icon{width:110px;height:110px;margin-bottom:20px}
.splash-title{font-size:30px;font-weight:700;color:var(--ink);text-align:center;margin-bottom:6px;line-height:1.2;font-family:'Patrick Hand',cursive}
.splash-sub{font-size:18px;color:var(--green);margin-bottom:24px;font-family:'Patrick Hand',cursive}
.splash-quote-wrap{position:relative;margin-bottom:36px;width:100%;max-width:300px}
.splash-quote-wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.splash-quote{font-size:16px;color:var(--ink2);text-align:center;line-height:1.7;
  font-style:italic;font-family:'Patrick Hand',cursive;padding:14px 18px;position:relative;z-index:1}
.splash-btn-wrap{position:relative;width:100%;max-width:300px;cursor:pointer}
.splash-btn-wrap svg.btn-bg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.splash-btn-text{font-family:'Patrick Hand',cursive;font-size:22px;font-weight:700;color:#fff;
  text-align:center;padding:14px 16px;position:relative;z-index:1}
.splash-phase{font-size:13px;color:var(--ink3);margin-top:16px;font-family:'Patrick Hand',cursive}

/* LAYOUT */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#header{padding:0;background:var(--paper);z-index:20;flex-shrink:0;border-bottom:2px solid var(--line)}
.header-spine{height:10px;background:repeating-linear-gradient(90deg,#cc3333 0,#cc3333 7px,transparent 7px,transparent 22px)}
.header-inner{padding:10px 16px 10px 52px;position:relative;
  background-image:linear-gradient(var(--line) 1px,transparent 1px);
  background-size:100% 32px;background-position:0 31px}
.header-margin{position:absolute;left:44px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.6}
.header-hole{position:absolute;left:14px;width:14px;height:14px;border-radius:50%;
  background:#f0f0f0;border:1.5px solid #ccc;box-shadow:inset 0 1px 3px rgba(0,0,0,.15)}
.header-greeting{font-size:13px;color:var(--ink3);line-height:32px}
.header-name{font-size:26px;font-weight:700;color:var(--ink);line-height:32px}
.phase-row{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:8px 0 4px}
.phase-row::-webkit-scrollbar{display:none}

/* PHASE BUTTON — bordo SVG */
.pp-wrap{flex-shrink:0;position:relative;cursor:pointer}
.pp-wrap svg.pp-bg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.pp-text{font-family:'Patrick Hand',cursive;font-size:15px;font-weight:600;padding:6px 16px;position:relative;z-index:1;white-space:nowrap;color:var(--ink3)}
.pp-wrap.active .pp-text{color:var(--green)}

.phase-desc{font-size:13px;color:var(--ink3);line-height:1.5;padding:4px 0 8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* DAY BAR */
#daybar{flex-shrink:0;background:var(--paper);border-bottom:2px solid var(--line)}
.day-scroll{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 10px 52px;scrollbar-width:none;position:relative}
.day-scroll::-webkit-scrollbar{display:none}
.day-margin{position:absolute;left:44px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.6}

/* DAY CHIP */
.dc-wrap{flex-shrink:0;position:relative;cursor:pointer;text-align:center}
.dc-wrap svg.dc-bg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.dc-inner{padding:7px 6px 6px;width:62px;position:relative;z-index:1}
.dc-lbl{font-family:'Patrick Hand',cursive;font-size:14px;font-weight:700;color:var(--ink3);line-height:1.2}
.dc-dot{width:7px;height:7px;border-radius:50%;margin:3px auto}
.dc-type{font-family:'Patrick Hand',cursive;font-size:11px;color:var(--ink3);line-height:1.2}
.dc-wrap.sel .dc-lbl{color:var(--ink)}
.dc-wrap.sel .dc-type{color:var(--ink2)}
.dc-done{position:absolute;top:3px;right:4px;width:8px;height:8px;background:var(--green);border-radius:50%;border:1.5px solid white;z-index:2}

/* CONTENT */
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 110px 52px;position:relative}
.content-margin{position:absolute;left:44px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.6;pointer-events:none}

/* FOOTER */
#footer{position:fixed;bottom:0;left:0;right:0;background:var(--paper);
  border-top:2px solid var(--line);
  padding:10px 14px max(16px,env(safe-area-inset-bottom));z-index:20}

/* TRACKER */
.tracker{position:relative;margin-bottom:14px;padding:14px 14px 14px 10px}
.tracker svg.tbg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.tracker-title{font-family:'Patrick Hand',cursive;font-size:12px;color:var(--ink3);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;position:relative;z-index:1}
.tracker-stats{display:flex;gap:8px;position:relative;z-index:1}
.tstat{flex:1;position:relative;padding:10px 8px;text-align:center}
.tstat svg.sbg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.tstat-val{font-family:'Patrick Hand',cursive;font-size:28px;font-weight:700;color:var(--ink);position:relative;z-index:1}
.tstat-lbl{font-family:'Patrick Hand',cursive;font-size:12px;color:var(--ink3);position:relative;z-index:1}

/* DAY HEADER */
.day-header{position:relative;margin-bottom:12px;padding:12px 12px 12px 10px}
.day-header svg.dhbg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.day-header-title{font-family:'Patrick Hand',cursive;font-size:22px;font-weight:700;color:var(--ink);position:relative;z-index:1}
.day-header-meta{font-family:'Patrick Hand',cursive;font-size:14px;color:var(--ink3);position:relative;z-index:1}
.day-type-badge{display:inline-block;position:relative;margin-top:8px}
.day-type-badge svg.dbbg{position:absolute;inset:-4px -8px;width:calc(100% + 16px);height:calc(100% + 8px);overflow:visible;pointer-events:none}
.day-type-badge-text{font-family:'Patrick Hand',cursive;font-size:15px;font-weight:600;position:relative;z-index:1;padding:2px 6px}

/* CARDIO CARD */
.ccard{position:relative;margin-bottom:12px;padding:14px 14px 14px 12px}
.ccard svg.cbg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.ccard-inner{position:relative;z-index:1}
.ccard-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ccard-icon{width:48px;height:48px;flex-shrink:0}
.ctag{font-family:'Patrick Hand',cursive;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ctag.run{color:var(--orange)}.ctag.walk{color:var(--blue)}
.cmetrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.cm{position:relative;padding:8px 10px}
.cm svg.cmbg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.cm-l{font-family:'Patrick Hand',cursive;font-size:12px;color:var(--ink3);position:relative;z-index:1}
.cm-v{font-family:'Patrick Hand',cursive;font-size:18px;font-weight:700;color:var(--ink);position:relative;z-index:1}
.cnote{font-family:'Patrick Hand',cursive;font-size:14px;color:var(--ink2);line-height:1.65;margin-bottom:10px}
.cintv{position:relative}
.ci{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
.ci:last-child{border-bottom:none}
.ci-l{font-family:'Patrick Hand',cursive;font-size:14px;color:var(--ink3)}
.ci-v{font-family:'Patrick Hand',cursive;font-size:15px;font-weight:700;color:var(--ink)}

/* SECTION TITLE */
.sec-title{font-family:'Patrick Hand',cursive;font-size:13px;color:var(--ink3);
  letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px}

/* EXERCISE CARD */
.ecard{position:relative;margin-bottom:10px}
.ecard svg.ebg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;transition:opacity .15s}
.ecard-header{display:flex;align-items:center;cursor:pointer;padding:12px 12px 12px 10px;gap:12px;position:relative;z-index:1}
.esvg{flex-shrink:0;width:56px;height:56px;position:relative}
.esvg-bg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.esvg img{width:100%;height:100%;object-fit:contain;position:relative;z-index:1;padding:4px}
.einfo{flex:1;min-width:0}
.ename{font-family:'Patrick Hand',cursive;font-size:18px;font-weight:700;color:var(--ink);line-height:1.2;margin-bottom:4px}
.emeta{display:flex;gap:5px;flex-wrap:wrap}
.etag-wrap{position:relative;display:inline-block}
.etag-wrap svg.etagbg{position:absolute;inset:-3px -6px;width:calc(100% + 12px);height:calc(100% + 6px);overflow:visible;pointer-events:none}
.etag-text{font-family:'Patrick Hand',cursive;font-size:13px;padding:1px 4px;position:relative;z-index:1}
.echevron{flex-shrink:0;font-size:16px;color:var(--ink3);transition:transform .2s;width:24px;text-align:center}
.ecard.open .echevron{transform:rotate(180deg)}
.ebody{display:none;padding:0 12px 14px 10px;position:relative;z-index:1}
.ecard.open .ebody{display:block}
.ehow{font-family:'Patrick Hand',cursive;font-size:14px;color:var(--ink2);line-height:1.75;margin:10px 0 12px}

/* SERIES */
.series-label{font-family:'Patrick Hand',cursive;font-size:12px;color:var(--ink3);
  letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
.series-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.ser-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ser-wrap svg.serbg{position:absolute;inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px);overflow:visible;pointer-events:none}
.ser-inner{width:48px;height:48px;display:flex;align-items:center;justify-content:center;
  flex-direction:column;font-family:'Patrick Hand',cursive;font-size:16px;color:var(--ink2);position:relative;z-index:1}
.ser-inner.done{color:var(--green);font-size:20px}
.ser-inner small{font-size:10px;color:var(--ink3)}

/* TIMER */
.timer-wrap{position:relative;margin:8px 0;cursor:pointer}
.timer-wrap svg.tmbg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.timer-inner{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;position:relative;z-index:1}
.timer-icon{width:28px;height:28px;flex-shrink:0}
.timer-text{font-family:'Patrick Hand',cursive;font-size:17px;color:var(--ink2)}
.timer-wrap.running .timer-text{color:var(--orange);animation:pulse 1s ease-in-out infinite}
.timer-wrap.done-t .timer-text{color:var(--green)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}

/* YOUTUBE LINK */
.yt-link{display:flex;align-items:center;gap:6px;margin-top:2px;margin-bottom:10px;
  font-family:'Patrick Hand',cursive;font-size:15px;color:var(--orange);text-decoration:none;
  border-bottom:1.5px dashed var(--orange);width:fit-content;padding-bottom:1px}

/* REST CARD */
.rest-card{position:relative;padding:28px 20px;text-align:center;margin-bottom:12px}
.rest-card svg.restbg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.rest-icon{font-size:40px;display:block;margin-bottom:10px;position:relative;z-index:1}
.rest-title{font-family:'Patrick Hand',cursive;font-size:22px;font-weight:700;color:var(--ink);margin-bottom:6px;position:relative;z-index:1}
.rest-sub{font-family:'Patrick Hand',cursive;font-size:15px;color:var(--ink3);position:relative;z-index:1}

/* COMPLETE BTN */
.complete-wrap{position:relative;margin-top:16px;cursor:pointer}
.complete-wrap svg.cbtnbg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.complete-text{font-family:'Patrick Hand',cursive;font-size:20px;font-weight:700;text-align:center;padding:14px 16px;position:relative;z-index:1}
.complete-wrap.active .complete-text{color:#fff}
.complete-wrap.inactive .complete-text{color:var(--ink3)}
.complete-wrap.completed .complete-text{color:var(--green)}

/* NAV */
.nav-row{display:flex;gap:8px}
.nb-wrap{flex:1;position:relative;cursor:pointer}
.nb-wrap svg.nbbg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.nb-text{font-family:'Patrick Hand',cursive;font-size:17px;color:var(--ink2);text-align:center;padding:11px 8px;position:relative;z-index:1}
.nb-wrap:disabled .nb-text,.nb-wrap[disabled] .nb-text{opacity:.3}

/* TOAST */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--green);color:#fff;padding:9px 18px;border-radius:4px;
  font-family:'Patrick Hand',cursive;font-size:17px;font-weight:600;
  box-shadow:2px 3px 0 #1a4d1d;
  opacity:0;transition:all .3s;pointer-events:none;z-index:100;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

// ─── STATE ───────────────────────────────────────────────────────────────────
// Chiavi fisse: i dati sopravvivono anche quando sostituisci il file HTML
const KEYS={completed:'marco_training_completed_v1',serDone:'marco_training_serDone_v1'};

let cP=0,cD=0;
let completed=JSON.parse(localStorage.getItem(KEYS.completed)||'[[],[],[]]');
let serDone=JSON.parse(localStorage.getItem(KEYS.serDone)||'[[[],[]],[[],[]],[[],[]]]');
let timerInt=null,timerRemain=0,timerBtn=null,timerExKey=null;

function saveState(){
  try{
    localStorage.setItem(KEYS.completed,JSON.stringify(completed));
    localStorage.setItem(KEYS.serDone,JSON.stringify(serDone));
  }catch(e){}
}

// Migrazione: se esistono dati vecchi (chiavi mco_*), li importa automaticamente
(function migrate(){
  try{
    const oldC=localStorage.getItem('mco_completed');
    const oldS=localStorage.getItem('mco_serDone');
    if(oldC&&!localStorage.getItem(KEYS.completed)){localStorage.setItem(KEYS.completed,oldC);completed=JSON.parse(oldC);}
    if(oldS&&!localStorage.getItem(KEYS.serDone)){localStorage.setItem(KEYS.serDone,oldS);serDone=JSON.parse(oldS);}
    if(oldC)localStorage.removeItem('mco_completed');
    if(oldS)localStorage.removeItem('mco_serDone');
  }catch(e){}
})();

function initState(){
  while(completed.length<3)completed.push([]);
  phases.forEach((ph,pi)=>{
    while(completed[pi].length<ph.days.length)completed[pi].push(false);
    while(serDone.length<=pi)serDone.push([]);
    ph.days.forEach((d,di)=>{
      while(serDone[pi].length<=di)serDone[pi].push([]);
      d.ex.forEach((_,ei)=>{
        while(serDone[pi][di].length<=ei)serDone[pi][di].push([]);
      });
    });
  });
}
initState();

// Genera path irregolari per bordi hand-drawn
function sketchRect(w,h,stroke,fill,sw=1.8){
  const jitter=(v,a=2)=>v+(Math.random()-.5)*a;
  const x1=jitter(3),y1=jitter(6),x2=jitter(w-3),y2=jitter(h-4);
  return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" fill="none">
    <path d="M${x1} ${jitter(10)} C${jitter(x1+4)} ${jitter(3)},${jitter(16)} ${jitter(2)},${jitter(28)} ${jitter(2)} C${jitter(w/2)} ${jitter(2)},${jitter(w-20)} ${jitter(2)},${x2} ${jitter(4)} C${jitter(w-2)} ${jitter(8)},${jitter(w-1)} ${jitter(14)},${jitter(w-2)} ${jitter(h/2)} C${jitter(w-1)} ${jitter(h-14)},${jitter(w-2)} ${jitter(h-8)},${x2} ${jitter(h-3)} C${jitter(w-16)} ${jitter(h-1)},${jitter(w/2)} ${jitter(h-1)},${jitter(24)} ${jitter(h-2)} C${jitter(12)} ${jitter(h-2)},${jitter(3)} ${jitter(h-4)},${x1} ${jitter(h-6)} C${jitter(1)} ${jitter(h-12)},${jitter(2)} ${jitter(h/2)},${x1} ${jitter(10)} Z" stroke="${stroke}" stroke-width="${sw}" fill="${fill}"/>
  </svg>`;
}

// ─── TIMER ───────────────────────────────────────────────────────────────────
function startTimer(sec,key){
  const wrap=document.getElementById('tw-'+key);
  if(!wrap)return;
  const txt=wrap.querySelector('.timer-text');
  if(timerInt){
    clearInterval(timerInt);
    if(timerExKey===key){
      wrap.className='timer-wrap';
      txt.textContent='⏱ Avvia recupero ('+sec+'s)';
      timerInt=null;timerBtn=null;timerExKey=null;return;
    }
  }
  if(timerBtn){timerBtn.className='timer-wrap';if(timerBtn.querySelector('.timer-text'))timerBtn.querySelector('.timer-text').textContent='⏱ Avvia recupero';}
  timerRemain=sec;timerBtn=wrap;timerExKey=key;
  function tick(){
    if(timerRemain<=0){
      clearInterval(timerInt);timerInt=null;
      wrap.className='timer-wrap done-t';
      txt.textContent='✓ Recupero finito!';
      try{if('vibrate'in navigator)navigator.vibrate([100,50,100]);}catch(e){}return;
    }
    const m=Math.floor(timerRemain/60),s=timerRemain%60;
    wrap.className='timer-wrap running';
    txt.textContent=`⏱ ${m}:${s.toString().padStart(2,'0')} — tocca per fermare`;
    timerRemain--;
  }
  tick();timerInt=setInterval(tick,1000);
}

  const typeColors={str:{stroke:'#5b1285',fill:'rgba(245,234,255,.7)',label:'💪 Forza',tc:'#5b1285'},
    run:{stroke:'#c94a00',fill:'rgba(255,240,230,.7)',label:'🏃 Corsa',tc:'#c94a00'},
    walk:{stroke:'#1a4e8a',fill:'rgba(232,240,255,.7)',label:'🚶 Camminata',tc:'#1a4e8a'},
    rest:{stroke:'#6b6b6b',fill:'rgba(240,240,240,.7)',label:'😴 Riposo',tc:'#6b6b6b'}};
  const tc=typeColors[d.type]||typeColors.rest;

  // Day header
  h+=`<div class="day-header">

      <svg class="cbg" viewBox="0 0 310 ${c.intervals?200:160}" preserveAspectRatio="none" fill="none">
        <path d="M3 10 C4 3,12 2,26 2 C100 2,220 2,282 3 C296 3,307 7,308 14 C309 80,308 130,308 150 C308 165,302 167,288 167 C220 168,100 167,26 166 C12 166,2 162,2 152 C2 100,2 28,3 10 Z" stroke="${cstroke}" stroke-width="2" fill="${cfill}"/>
      </svg>
      <div class="ccard-inner">
        <div class="ccard-header">
          <img class="ccard-icon" src="${cardioIcon}" alt="cardio">
          <div class="ctag ${c.type}">${isRun?'Sessione di corsa':'Sessione di camminata'}</div>
        </div>
        <div class="cmetrics">${c.metrics.map(m=>`<div class="cm">
          <svg class="cmbg" viewBox="0 0 140 52" preserveAspectRatio="none" fill="none">
            <path d="M2 6 C3 2,8 2,16 2 C50 2,96 2,122 3 C132 3,138 6,138 12 C138 26,137 36,137 44 C137 49,132 50,122 50 C96 50,46 50,18 49 C10 49,2 46,2 40 C2 28,2 14,2 6 Z" stroke="rgba(0,0,0,.1)" stroke-width="1.2" fill="rgba(255,255,255,.5)"/>
          </svg>
          <div class="cm-l">${m.l}</div><div class="cm-v">${m.v}</div>
        </div>`).join('')}</div>
        <div class="cnote">${c.note}</div>
        ${c.intervals?`<div class="cintv">${c.intervals.map(r=>`<div class="ci"><span class="ci-l">${r.l}</span><span class="ci-v">${r.v}</span></div>`).join('')}</div>`:''}
      </div>
    </div>`;
  }

  // Exercises
  if(d.ex.length>0){
    h+=`<div class="sec-title">${d.cardio?'Esercizi aggiuntivi':'Esercizi'}</div>`;
    d.ex.forEach((ex,ei)=>{h+=renderExercise(ex,cP,cD,ei);});
  }

  // Rest day
  if(d.type==='rest'&&!d.cardio&&d.ex.length===0){
    const stretchSrc=ICONS_B64['stretching']||'';
    h+=`<div class="rest-card">

  const isDone=completed[cP][cD];
  const btnStroke=isDone?'#276b2a':'#276b2a';

    </svg>
    <div class="complete-text" style="color:${btnColor}">${isDone?'✓ Sessione completata — tocca per annullare':'Segna sessione come completata'}</div>
  </div>`;

  document.getElementById('content').innerHTML=h;
  document.getElementById('btnP').disabled=(cD===0&&cP===0);
  document.getElementById('btnN').disabled=(cD===6&&cP===2);
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
function toggleEx(key){
  const el=document.getElementById('ec-'+key);
  if(el)el.classList.toggle('open');
}

function toggleSer(pi,di,ei,si){
  while(serDone[pi][di][ei].length<=si)serDone[pi][di][ei].push(false);
  serDone[pi][di][ei][si]=!serDone[pi][di][ei][si];
  saveState();
  renderMain();
  // re-open
  const key=`${pi}-${di}-${ei}`;
  setTimeout(()=>{const el=document.getElementById('ec-'+key);if(el)el.classList.add('open');},10);
}

function toggleComplete(){
  completed[cP][cD]=!completed[cP][cD];
  saveState();
  if(completed[cP][cD])showToast('Sessione completata! 💪');
  renderDayBar();
  renderMain();
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function selP(i){cP=i;cD=0;renderNav();renderDayBar();renderMain();}
function selD(i){cD=i;renderDayBar();renderMain();}
function goAdj(dir){
  const p=document.getElementById('btnP');
  const n=document.getElementById('btnN');
  let nd=cD+dir;
  if(nd<0&&cP>0){cP--;cD=6;renderNav();}
  else if(nd>6&&cP<2){cP++;cD=0;renderNav();}
  else if(nd>=0&&nd<=6){cD=nd;}
  renderDayBar();renderMain();
  p.style.opacity=(cD===0&&cP===0)?'.3':'1';
  n.style.opacity=(cD===6&&cP===2)?'.3':'1';
}

  '"Non devi essere forte per cominciare, ma devi cominciare per diventare forte."',

  '"Tra un anno guarderai indietro e sarai felice di aver iniziato oggi."',
  '"La fatica di oggi è la forza di domani."',
  '"Non smettere quando sei stanco. Smetti quando hai finito."',
  '"Ogni rep conta. Ogni sessione conta. Ogni giorno conta."',
];

function initSplash(){
  const q=QUOTES[Math.floor(Math.random()*QUOTES.length)];
  document.getElementById('splashQuote').textContent=q;
  const phaseNames=['Fase 1 — Fondamenta','Fase 2 — Intensità','Fase 3 — Consolidamento'];
  const done=completed.flat().filter(Boolean).length;
  const total=completed.flat().length;
  document.getElementById('splashPhase').textContent=`${phaseNames[cP]} · ${done}/${total} sessioni completate`;
}

function enterApp(){
  document.getElementById('splash').classList.add('hidden');
  document.getElementById('app').style.visibility='visible';
}

// ─── INIT ────────────────────────────────────────────────────────────────────
renderNav();renderDayBar();renderMain();initSplash();
</script>
