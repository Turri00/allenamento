<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Piano Allenamento · Marco</title>
<style>
/* ── PALETTE SPORT WHITE ── */
:root{
  --bg:#f5f5f5;--s1:#ffffff;--s2:#f0f0f0;--s3:#e8e8e8;
  --bd:#e0e0e0;--bd2:#d0d0d0;
  --tx:#111111;--tx2:#555555;--tx3:#999999;
  --run:#e65100;--run-d:#fff3e0;--run-b:#fff8f4;
  --str:#6a1b9a;--str-d:#f3e5f5;
  --walk:#1565c0;--walk-d:#e3f2fd;
  --rest:#757575;--rest-d:#f5f5f5;
  --acc:#2e7d32;--acc2:#e65100;
  --r:14px;--r2:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5}

/* ── SPLASH ── */
#splash{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:200;padding:40px 32px;
  transition:opacity .4s ease,visibility .4s ease}
#splash.hidden{opacity:0;visibility:hidden}
.splash-icon{font-size:56px;margin-bottom:24px;line-height:1}
.splash-title{font-size:28px;font-weight:700;color:#111;text-align:center;margin-bottom:8px;line-height:1.2}
.splash-name{font-size:16px;color:#2e7d32;font-weight:600;margin-bottom:32px}
.splash-quote{font-size:15px;color:#555;text-align:center;line-height:1.7;
  max-width:280px;margin-bottom:48px;font-style:italic}
.splash-btn{width:100%;max-width:280px;padding:16px;border-radius:14px;border:none;
  background:#2e7d32;color:#fff;font-size:17px;font-weight:700;font-family:inherit;
  cursor:pointer;letter-spacing:.01em;transition:transform .1s,background .1s}
.splash-btn:active{transform:scale(.97);background:#1b5e20}
.splash-phase{font-size:12px;color:#999;margin-top:16px;letter-spacing:.05em;text-transform:uppercase}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#header{padding:14px 16px 10px;border-bottom:1px solid var(--bd);background:#fff;z-index:20;flex-shrink:0}
#daybar{flex-shrink:0;border-bottom:1px solid var(--bd);background:#fff}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 100px}
#footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1.5px solid var(--bd);
  padding:10px 16px max(16px,env(safe-area-inset-bottom));z-index:20}

/* ── HEADER ── */
.app-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin-bottom:8px}
.phase-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.phase-row::-webkit-scrollbar{display:none}
.pp{flex-shrink:0;padding:7px 16px;border-radius:99px;border:1.5px solid var(--bd2);
  background:#fff;color:var(--tx3);font-size:12px;font-weight:700;font-family:inherit;
  cursor:pointer;letter-spacing:.02em;transition:all .15s}
.pp.active{background:#2e7d32;color:#fff;border-color:#2e7d32}
.phase-desc{font-size:12px;color:var(--tx3);margin-top:8px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── DAY BAR ── */
.day-scroll{display:flex;gap:5px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.day-scroll::-webkit-scrollbar{display:none}
.dc{flex-shrink:0;width:68px;background:#fff;border:1.5px solid var(--bd);
  border-radius:12px;padding:8px 4px 7px;cursor:pointer;text-align:center;transition:all .15s;position:relative}
.dc.sel{border-color:#2e7d32;background:#f1f8f1}
.dc-lbl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3);margin-bottom:3px}
.dc-dot{width:7px;height:7px;border-radius:50%;margin:3px auto}
.dc-type{font-size:9px;color:var(--tx3);margin-top:3px;line-height:1.2}
.dc-done{position:absolute;top:4px;right:5px;width:7px;height:7px;background:#2e7d32;border-radius:50%}

/* ── TRACKER ── */
.tracker{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:14px}
.tracker-title{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3);margin-bottom:10px}
.tracker-stats{display:flex;gap:8px;margin-top:4px}
.tstat{flex:1;background:var(--s2);border-radius:var(--r2);padding:8px 10px;text-align:center}
.tstat-val{font-size:18px;font-weight:700;margin-bottom:1px}
.tstat-lbl{font-size:10px;color:var(--tx3)}

/* ── CARDIO CARD ── */
.ccard{border-radius:var(--r);padding:14px;margin-bottom:12px;border:1.5px solid transparent}
.ccard.run{background:var(--run-b);border-color:#ffccbc}
.ccard.walk{background:var(--walk-d);border-color:#bbdefb}
.ctag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.ctag.run{color:var(--run)}.ctag.walk{color:var(--walk)}
.cmetrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.cm{background:rgba(0,0,0,.04);border-radius:8px;padding:7px 10px}
.cm-l{font-size:10px;color:var(--tx3);margin-bottom:1px}
.cm-v{font-size:13px;font-weight:700;color:var(--tx)}
.cnote{font-size:12px;color:var(--tx2);line-height:1.65;margin-bottom:8px}
.cintv{background:rgba(0,0,0,.04);border-radius:8px;overflow:hidden}
.ci{display:flex;justify-content:space-between;padding:6px 10px;
  border-bottom:1px solid rgba(0,0,0,.06);font-size:12px}
.ci:last-child{border-bottom:none}
.ci-l{color:var(--tx3)}.ci-v{font-weight:600;color:var(--tx)}

/* ── SECTION TITLE ── */
.sec-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin:0 0 8px}

/* ── EXERCISE CARD ── */
.ecard{background:#fff;border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.ecard.open{border-color:#bdbdbd}
.ecard-header{display:flex;align-items:center;cursor:pointer;padding:13px;gap:12px}
.esvg{flex-shrink:0;width:52px;height:52px;background:var(--s2);border-radius:10px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:26px}
.einfo{flex:1;min-width:0}
.ename{font-size:14px;font-weight:600;line-height:1.3;margin-bottom:4px;color:var(--tx)}
.emeta{display:flex;gap:5px;flex-wrap:wrap}
.etag{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600}
.etag.sets{background:#f3e5f5;color:#6a1b9a}
.etag.muscles{background:var(--s2);color:var(--tx3)}
.echevron{flex-shrink:0;color:var(--tx3);font-size:18px;align-self:center;transition:transform .2s}
.ecard.open .echevron{transform:rotate(180deg)}

/* ── EXERCISE BODY ── */
.ebody{display:none;padding:0 13px 14px;border-top:1px solid var(--bd)}
.ecard.open .ebody{display:block}
.ehow{font-size:13px;color:var(--tx2);line-height:1.75;margin:12px 0 14px}

/* ── SERIES ── */
.series-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.ser-btn{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--bd2);
  background:var(--s2);color:var(--tx3);font-size:12px;font-weight:700;font-family:inherit;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:all .15s}
.ser-btn span{font-size:9px;font-weight:400;margin-top:1px}
.ser-btn.done{background:#e8f5e9;border-color:#2e7d32;color:#2e7d32}
.ser-btn.done::after{content:'✓';font-size:16px;font-weight:700}

/* ── TIMER ── */
.timer-btn{width:100%;padding:11px;border-radius:var(--r2);border:1.5px solid var(--bd2);
  background:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;color:var(--tx2)}
.timer-btn.running{background:#fff3e0;border-color:#e65100;color:#e65100;animation:pulse 1s ease-in-out infinite}
.timer-btn.done-t{background:#e8f5e9;border-color:#2e7d32;color:#2e7d32}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}

/* ── REST CARD ── */
.rest-card{background:#fff;border:1px solid var(--bd);border-radius:var(--r);
  padding:24px;text-align:center;color:var(--tx3);font-size:14px;line-height:1.7}

/* ── COMPLETE BTN ── */
.complete-btn{width:100%;padding:15px;border-radius:var(--r);border:none;font-family:inherit;
  font-size:15px;font-weight:700;cursor:pointer;transition:all .15s}
.complete-btn.inactive{background:var(--s2);color:var(--tx3);border:1.5px solid var(--bd)}
.complete-btn.active{background:#2e7d32;color:#fff}
.complete-btn.completed{background:#e8f5e9;color:#2e7d32;border:1.5px solid #2e7d32}

/* ── NAV BTNS ── */
.nav-row{display:flex;gap:8px}
.nb{flex:1;padding:12px;border-radius:var(--r2);border:1.5px solid var(--bd2);
  background:#fff;color:var(--tx);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.nb:disabled{opacity:.3}

/* ── TOAST ── */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#2e7d32;color:#fff;padding:8px 18px;border-radius:99px;
  font-size:13px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:100;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

<div id="toast"></div>

// Chiavi fisse: i dati sopravvivono anche quando sostituisci il file HTML
const KEYS={completed:'marco_training_completed_v1',serDone:'marco_training_serDone_v1'};

let cP=0,cD=0;
let completed=JSON.parse(localStorage.getItem(KEYS.completed)||'[[],[],[]]');
let serDone=JSON.parse(localStorage.getItem(KEYS.serDone)||'[[[],[]],[[],[]],[[],[]]]');
let timerInt=null,timerRemain=0,timerBtn=null,timerExKey=null;

function saveState(){
  try{
    localStorage.setItem(KEYS.completed,JSON.stringify(completed));
    localStorage.setItem(KEYS.serDone,JSON.stringify(serDone));
  }catch(e){}
}

// Migrazione: se esistono dati vecchi (chiavi mco_*), li importa automaticamente
(function migrate(){
  try{
    const oldC=localStorage.getItem('mco_completed');
    const oldS=localStorage.getItem('mco_serDone');
    if(oldC&&!localStorage.getItem(KEYS.completed)){localStorage.setItem(KEYS.completed,oldC);completed=JSON.parse(oldC);}
    if(oldS&&!localStorage.getItem(KEYS.serDone)){localStorage.setItem(KEYS.serDone,oldS);serDone=JSON.parse(oldS);}
    if(oldC)localStorage.removeItem('mco_completed');
    if(oldS)localStorage.removeItem('mco_serDone');
  }catch(e){}
})();

function initState(){
  while(completed.length<3)completed.push([]);
  phases.forEach((ph,pi)=>{
    while(completed[pi].length<ph.days.length)completed[pi].push(false);
    while(serDone.length<=pi)serDone.push([]);
    ph.days.forEach((d,di)=>{
      while(serDone[pi].length<=di)serDone[pi].push([]);
      d.ex.forEach((_,ei)=>{
        while(serDone[pi][di].length<=ei)serDone[pi][di].push([]);
      });
    });
  });
}
initState();

// ─── TIMER ───────────────────────────────────────────────────────────────────
function startTimer(sec,key,btnEl){
  if(timerInt){clearInterval(timerInt);if(timerExKey===key&&timerBtn){timerBtn.className='timer-btn idle';timerBtn.textContent='⏱ Avvia recupero';timerInt=null;timerBtn=null;timerExKey=null;return;}}
  if(timerBtn&&timerBtn!==btnEl){timerBtn.className='timer-btn idle';timerBtn.textContent='⏱ Avvia recupero';}
  timerRemain=sec;timerBtn=btnEl;timerExKey=key;
  function tick(){
    if(timerRemain<=0){clearInterval(timerInt);timerInt=null;btnEl.className='timer-btn done-t';btnEl.textContent='✓ Recupero finito!';try{if('vibrate'in navigator)navigator.vibrate([100,50,100]);}catch(e){}return;}
    const m=Math.floor(timerRemain/60),s=timerRemain%60;
    btnEl.className='timer-btn running';
    btnEl.textContent=`⏱ ${m}:${s.toString().padStart(2,'0')} — tocca per fermare`;
    timerRemain--;
  }
  tick();timerInt=setInterval(tick,1000);
}

  ).join('');

function renderDayBar(){
  const days=phases[cP].days;

  document.getElementById('dayScroll').innerHTML=days.map((d,i)=>`
    <div class="dc ${i===cD?'sel':''}" onclick="selD(${i})">
      ${completed[cP][i]?'<div class="dc-done"></div>':''}
      <div class="dc-lbl">${d.label}</div>

function renderTracker(){
  const today=new Date().getDay();// 0=dom
  const dayLabels=['D','L','M','M','G','V','S'];
  let totalDone=0,totalSess=0;
  phases.forEach((_,pi)=>completed[pi].forEach(v=>{totalSess++;if(v)totalDone++;}));
  let dots=dayLabels.map((lb,i)=>{
    const isDone=false;// future: real tracking by date
    const isToday=i===today;
    return`<div class="tw"><div class="tw-label">${lb}</div>
      <div class="tw-dot ${isToday?'today':''}" title="${lb}"></div></div>`;
  }).join('');
  return`<div class="tracker">
    <div class="tracker-title">Progresso globale</div>
    <div class="tracker-stats">
      <div class="tstat"><div class="tstat-val" style="color:#22c55e">${totalDone}</div><div class="tstat-lbl">Sessioni completate</div></div>
      <div class="tstat"><div class="tstat-val" style="color:#a78bfa">${totalSess-totalDone}</div><div class="tstat-lbl">Sessioni rimanenti</div></div>
      <div class="tstat"><div class="tstat-val" style="color:#fbbf24">${Math.round(totalDone/totalSess*100)||0}%</div><div class="tstat-lbl">Del piano</div></div>
    </div>
  </div>`;
}

function renderExercise(ex,pi,di,ei){
  const key=`${pi}-${di}-${ei}`;
  const emoji=EMOJI[ex.svg]||EMOJI.default_ex;
  const sd=serDone[pi][di][ei]||[];
  const sets=ex.sets;
  const allDone=sd.filter(Boolean).length>=sets;

  let serbtns='';
  for(let s=0;s<sets;s++){
    const done=!!sd[s];
    if(done){
      serbtns+=`<button class="ser-btn done" onclick="toggleSer(${pi},${di},${ei},${s});event.stopPropagation()"></button>`;
    } else {
      serbtns+=`<button class="ser-btn" onclick="toggleSer(${pi},${di},${ei},${s});event.stopPropagation()">
        <span style="font-size:13px">${s+1}</span><span>serie</span>
      </button>`;
    }
  }

  const recSec=ex.rec||60;
  const wikiUrl=WIKI[ex.svg]||WIKI.default_ex;
  const wikiLink=`<a href="${wikiUrl}" target="_blank" rel="noopener"
    style="display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
    color:#1565c0;text-decoration:none;padding:7px 12px;border-radius:8px;
    background:#e3f2fd;border:1px solid #bbdefb;margin-top:2px">
    📖 Come si esegue — MuscleWiki ↗
  </a>`;
  const timerLabel=`⏱ Recupero ${recSec}s`;

  return`<div class="ecard" id="ec-${key}">
    <div class="ecard-header" onclick="toggleEx('${key}')">
      <div class="esvg">${emoji}</div>
      <div class="einfo">
        <div class="ename">${ex.n}</div>
        <div class="emeta">
          <span class="etag sets">${sets}×${ex.reps}</span>
          <span class="etag muscles">${ex.m}</span>
        </div>
      </div>
      <div class="echevron">⌄</div>
    </div>
    <div class="ebody">
      <div class="ehow">${ex.h}</div>
      ${wikiLink}
      <div style="margin-top:12px;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px">Spunta le serie completate</div>
      <div class="series-row">${serbtns}</div>
      ${recSec>0?`<button class="timer-btn idle" id="tb-${key}" onclick="startTimer(${recSec},'${key}',this)">⏱ Avvia recupero (${recSec}s)</button>`:''}
    </div>
  </div>`;
}

  // day header
  h+=`<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px">
    <div style="font-size:16px;font-weight:700">${d.label} — ${d.short}</div>
    <div style="font-size:11px;color:var(--tx3)">${d.loc} · ${d.dur}</div>
  </div>`;

  // cardio
  if(d.cardio){
    const c=d.cardio;
    const cls=c.type==='run'?'run':'walk';
    h+=`<div class="ccard ${cls}">
      <div class="ctag ${cls}">${c.type==='run'?'🏃 Sessione di corsa':'🚶 Sessione di camminata'}</div>
      <div class="cmetrics">${c.metrics.map(m=>`<div class="cm"><div class="cm-l">${m.l}</div><div class="cm-v">${m.v}</div></div>`).join('')}</div>
      <div class="cnote">${c.note}</div>
      ${c.intervals?`<div class="cintv">${c.intervals.map(r=>`<div class="ci"><span class="ci-l">${r.l}</span><span class="ci-v">${r.v}</span></div>`).join('')}</div>`:''}
    </div>`;
  }

  // exercises
  if(d.ex.length>0){
    if(d.cardio)h+=`<div class="sec-title" style="margin-top:4px">Esercizi</div>`;
    else h+=`<div class="sec-title">Esercizi</div>`;
    d.ex.forEach((ex,ei)=>{h+=renderExercise(ex,cP,cD,ei);});
  }

  if(d.type==='rest'&&!d.cardio&&d.ex.length===0){
    h+=`<div class="rest-card">Giorno di riposo 🛌<br>Il recupero fa parte del piano.<br>I muscoli crescono mentre riposi.</div>`;
  }

  // complete button
  const isDone=completed[cP][cD];
  h+=`<div style="margin-top:16px">
    <button class="complete-btn ${isDone?'completed':'active'}" onclick="toggleComplete()">
      ${isDone?'✓ Sessione completata — tocca per annullare':'Segna sessione come completata'}
    </button>
  </div>`;

  document.getElementById('content').innerHTML=h;

  // nav btns
  document.getElementById('btnP').disabled=(cD===0&&cP===0);
  document.getElementById('btnN').disabled=(cD===6&&cP===2);
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
function toggleEx(key){
  const el=document.getElementById('ec-'+key);
  if(el)el.classList.toggle('open');
}

function toggleSer(pi,di,ei,si){
  while(serDone[pi][di][ei].length<=si)serDone[pi][di][ei].push(false);
  serDone[pi][di][ei][si]=!serDone[pi][di][ei][si];
  saveState();
  renderMain();
  // re-open
  const key=`${pi}-${di}-${ei}`;
  setTimeout(()=>{const el=document.getElementById('ec-'+key);if(el)el.classList.add('open');},10);
}

function toggleComplete(){
  completed[cP][cD]=!completed[cP][cD];
  saveState();
  if(completed[cP][cD])showToast('Sessione completata! 💪');
  renderDayBar();
  renderMain();
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function selP(i){cP=i;cD=0;renderNav();renderDayBar();renderMain();}
function selD(i){cD=i;renderDayBar();renderMain();}
function goAdj(dir){
  let nd=cD+dir;
  if(nd<0&&cP>0){cP--;cD=6;renderNav();}
  else if(nd>6&&cP<2){cP++;cD=0;renderNav();}
  else if(nd>=0&&nd<=6){cD=nd;}
  renderDayBar();renderMain();
}

// ─── SPLASH SCREEN ───────────────────────────────────────────────────────────
const QUOTES=[
  '"La disciplina è fare quello che devi fare, anche quando non ne hai voglia."',
  '"Ogni allenamento è un mattone. La casa la costruisci tu."',
  '"Non devi essere forte per cominciare, ma devi cominciare per diventare forte."',
  '"Il corpo ottiene ciò che la mente crede."',
  '"Tra un anno guarderai indietro e sarai felice di aver iniziato oggi."',
  '"La fatica di oggi è la forza di domani."',
  '"Non smettere quando sei stanco. Smetti quando hai finito."',
  '"Ogni rep conta. Ogni sessione conta. Ogni giorno conta."',
];

function initSplash(){
  const q=QUOTES[Math.floor(Math.random()*QUOTES.length)];
  document.getElementById('splashQuote').textContent=q;
  const phaseNames=['Fase 1 — Fondamenta','Fase 2 — Intensità','Fase 3 — Consolidamento'];
  const done=completed.flat().filter(Boolean).length;
  const total=completed.flat().length;
  document.getElementById('splashPhase').textContent=`${phaseNames[cP]} · ${done}/${total} sessioni completate`;
}

function enterApp(){
  document.getElementById('splash').classList.add('hidden');
  document.getElementById('app').style.visibility='visible';
}

// ─── INIT ────────────────────────────────────────────────────────────────────
renderNav();renderDayBar();renderMain();initSplash();
</script>
</body>
</html>
