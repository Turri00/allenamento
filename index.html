<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Piano Allenamento · Marco</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

/* ── Lovable "Ritmo" design tokens — valori ESATTI estratti dal progetto ─────── */
:root{
  --background:#fafbf7;
  --foreground:#16241b;
  --card:#ffffff;
  --card-foreground:#16241b;
  --primary:#6aac87;
  --primary-foreground:#fbfcf9;
  --secondary:#daecdd;
  --secondary-foreground:#273e2e;
  --muted:#eaf2e9;
  --muted-foreground:#58685d;
  --accent:#ee7f66;
  --accent-foreground:#fbfcf9;
  --border:#d6e2d8;
  --radius:16px;
  --radius-lg:32px;   /* rounded-[2rem] hero cards */
  --radius-nav:28px;  /* rounded-[1.75rem] nav */

  /* Fonts */
  --font-display:'Sora',sans-serif;   /* titoli, numeri */
  --font-body:'Manrope',sans-serif;   /* testo */
  --font-mono:'JetBrains Mono',monospace;

  /* Legacy aliases — keep for JS compat */
  --bg:var(--background);
  --surface:var(--card);
  --surface2:var(--muted);
  --surface3:var(--secondary);
  --border2:var(--border);
  --ink:var(--foreground);
  --ink2:var(--muted-foreground);
  --ink3:#7f9080;
  --paper:var(--card);
  --paper2:var(--muted);
  --line:var(--border);
  --margin:var(--border);

  /* Accent palette (allineata alla palette Lovable) */
  --green:var(--primary);           --green-l:rgba(106,172,135,.14);
  --orange:var(--accent);           --orange-l:rgba(238,127,102,.14);
  --blue:#5b9bd5;                   --blue-l:rgba(91,155,213,.13);
  --purple:#9b87c0;                 --purple-l:rgba(155,135,192,.13);
  --gray:#8fa89e;                   --gray-l:rgba(0,0,0,.04);

  --r:var(--radius);
  --r-sm:12px;

  /* Ombra hero: shadow-[0_12px_40px_color-mix(...foreground 6%...)] */
  --shadow:0 1px 3px rgba(22,36,27,.04),0 4px 16px rgba(22,36,27,.04);
  --shadow-md:0 12px 40px rgba(22,36,27,.06);
  --shadow-xl:0 16px 48px rgba(22,36,27,.12);
}

/* ── Animations ─────────────────────────────────────────────────────────────── */
@keyframes rise-in{
  from{opacity:0;transform:translateY(16px) scale(.97)}
  to  {opacity:1;transform:translateY(0)    scale(1)}
}
@keyframes pulse-organic{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* ── Reset ──────────────────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:var(--font-body),system-ui,sans-serif;background:var(--background);color:var(--foreground);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* Font display (Sora) su titoli e numeri — come .font-display di Lovable */
.splash-title,.header-name,.tstat-val,.day-header-title,.cm-v,.ename,.rest-title,
.dash-val,.dc-date,.dc-num,.hero-num,.exnum,.hero-title,.sec-eyebrow-title{
  font-family:var(--font-display),sans-serif}
/* Sora non ha il 900: riporto i pesi a 700/800 */
.splash-title,.header-name,.tstat-val,.rest-title,.dash-val{font-weight:800}

.ruled-bg{}

/* ── SPLASH ─────────────────────────────────────────────────────────────────── */
#splash{position:fixed;inset:0;background:var(--background);display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:200;padding:40px 24px;
  transition:opacity .4s ease,visibility .4s ease}
#splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
.splash-margin,.splash-spine{display:none}
.splash-icon{width:88px;height:88px;margin-bottom:20px;border-radius:24px;
  box-shadow:var(--shadow-md),0 0 0 1px var(--border)}
.splash-title{font-size:28px;font-weight:900;color:var(--foreground);text-align:center;margin-bottom:4px;line-height:1.15;letter-spacing:-.6px}
.splash-sub{font-size:14px;color:var(--primary);margin-bottom:24px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.splash-quote-wrap{position:relative;margin-bottom:28px;width:100%;max-width:320px}
.splash-quote-wrap svg{display:none}
.splash-quote{font-size:14px;color:var(--muted-foreground);text-align:center;line-height:1.75;
  font-style:italic;padding:18px 20px;
  background:var(--card);border-radius:var(--radius-lg);border:1px solid var(--border);
  box-shadow:var(--shadow)}
.splash-btn-wrap,.splash-btn{display:block;position:relative;width:100%;max-width:320px;cursor:pointer;
  background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 78%,#000));border-radius:var(--radius-lg);
  box-shadow:0 4px 20px color-mix(in srgb,var(--primary) 35%,transparent);border:none;
  font-size:17px;font-weight:800;color:#fff;text-align:center;padding:18px;
  font-family:'Manrope',system-ui,sans-serif;letter-spacing:-.1px;
  animation:.7s cubic-bezier(.16,1,.3,1) both rise-in}
.splash-btn-wrap svg.btn-bg{display:none}
.splash-btn-text{font-size:17px;font-weight:800;color:#fff;text-align:center;padding:18px;position:relative;z-index:1}
.splash-phase{font-size:13px;color:var(--ink3);margin-top:14px;font-weight:500}

/* ── LAYOUT (colonna unica scrollabile, come Lovable) ───────────────────────── */
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding:0 0 128px;position:relative}
#header{padding:24px 20px 8px;background:transparent;border:none}
.header-spine,.header-hole{display:none}
.header-inner{position:relative}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.header-greeting{font-size:11px;color:var(--primary);font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:2px}
.header-name{font-size:28px;font-weight:800;color:var(--foreground);letter-spacing:-.6px}
.header-avatar{flex-shrink:0;width:48px;height:48px;border-radius:50%;
  border:1px solid var(--border);background:var(--card);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display),sans-serif;font-weight:700;font-size:14px;color:var(--primary);
  box-shadow:var(--shadow)}
#weekLabel{font-size:13px;color:var(--muted-foreground);font-weight:600}

/* Sezioni: eyebrow + titolo (come le sezioni Lovable) */
.sec-block{padding:0 20px;margin-top:28px;animation:.6s cubic-bezier(.16,1,.3,1) both rise-in}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-eyebrow{font-size:11px;color:var(--muted-foreground);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.sec-eyebrow.pri{color:var(--primary)}
.sec-title-lg{font-size:20px;font-weight:700;color:var(--foreground);letter-spacing:-.3px;font-family:var(--font-display),sans-serif}
.sec-aside{font-size:12px;color:var(--muted-foreground);font-weight:600;white-space:nowrap;font-family:var(--font-mono),monospace}

/* Frecce navigazione settimana */
.wk-nav{display:inline-flex;align-items:center;gap:6px}
.wk-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--card);
  color:var(--muted-foreground);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background-color .15s,color .15s}
.wk-btn:hover{background:var(--secondary);color:var(--primary)}
.wk-btn:disabled{opacity:.35;cursor:default}

/* ── PHASE PILL ─────────────────────────────────────────────────────────────── */
.phase-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 2px}
.phase-row::-webkit-scrollbar{display:none}
.pp-wrap{flex-shrink:0;cursor:pointer;
  background:var(--card);border:1px solid var(--border);border-radius:14px;transition:all .18s}
.pp-wrap svg.pp-bg{display:none}
.pp-text{font-size:13px;font-weight:600;padding:8px 14px;display:block;white-space:nowrap;color:var(--muted-foreground)}
.pp-wrap.active{background:var(--secondary);border-color:var(--primary)}
.pp-wrap.active .pp-text{color:var(--secondary-foreground)}
.phase-desc{font-size:13px;color:var(--muted-foreground);line-height:1.55;margin-top:12px}

/* ── DAY BAR ────────────────────────────────────────────────────────────────── */
.day-scroll{display:flex;gap:10px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;position:relative}
.day-scroll::-webkit-scrollbar{display:none}
.day-margin{display:none}

/* ── DAY CHIP (Lovable: h-24 min-w-16 rounded-2xl) ─────────────────────────── */
.dc-wrap{flex-shrink:0;cursor:pointer;text-align:center;
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  transition:background-color .18s,border-color .18s,box-shadow .18s}
.dc-wrap:hover:not(.sel){background:color-mix(in srgb,var(--secondary) 60%,transparent)}
.dc-wrap svg.dc-bg{display:none}
.dc-inner{padding:0 8px;width:64px;height:92px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;position:relative;z-index:1}
.dc-lbl{font-size:10px;font-weight:700;color:var(--muted-foreground);letter-spacing:.04em;text-transform:uppercase}
.dc-date{font-size:18px;font-weight:700;color:var(--foreground);margin-top:4px;line-height:1}
.dc-dot{width:6px;height:6px;border-radius:50%;margin-top:8px}
.dc-type{font-size:9px;color:var(--muted-foreground);font-weight:600;margin-top:5px}
.dc-wrap.sel{background:var(--primary);border-color:var(--primary);
  box-shadow:0 4px 14px color-mix(in srgb,var(--primary) 32%,transparent)}
.dc-wrap.sel .dc-lbl{color:color-mix(in srgb,var(--primary-foreground) 75%,transparent)}
.dc-wrap.sel .dc-date,.dc-wrap.sel .dc-type{color:var(--primary-foreground)}
.dc-wrap.sel .dc-dot{background:var(--primary-foreground)!important}
.dc-done{position:absolute;top:6px;right:7px;width:7px;height:7px;background:var(--primary);border-radius:50%;border:1.5px solid var(--card);z-index:2}
.dc-wrap.sel .dc-done{background:var(--primary-foreground);border-color:var(--primary)}

/* ── CONTENT ────────────────────────────────────────────────────────────────── */
#content{position:relative}

/* ── FOOTER (nav pill, come Lovable) ────────────────────────────────────────── */
#footer{position:fixed;left:16px;right:16px;bottom:16px;max-width:448px;margin:0 auto;
  background:color-mix(in srgb,var(--card) 90%,transparent);
  border:1px solid var(--border);border-radius:var(--radius-nav);
  padding:8px;z-index:40;
  box-shadow:var(--shadow-xl);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.nav-grid{display:grid;grid-template-columns:repeat(4,1fr)}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:8px 4px;border:none;background:transparent;cursor:pointer;border-radius:16px;
  color:var(--muted-foreground);font-family:inherit;transition:background-color .15s,color .15s}
.nav-btn .nav-ico{font-size:19px;line-height:1}
.nav-btn .nav-lbl{font-size:10px;font-weight:600}
.nav-btn.on{color:var(--primary);background:var(--secondary)}

/* ── TRACKER ────────────────────────────────────────────────────────────────── */
.tracker{margin-bottom:14px;padding:18px;
  background:var(--card);border-radius:var(--radius-lg);border:1px solid var(--border);
  box-shadow:var(--shadow);
  animation:.7s cubic-bezier(.16,1,.3,1) both rise-in}
.tracker svg.tbg{display:none}
.tracker-title{font-size:11px;color:var(--ink3);font-weight:800;
  letter-spacing:.09em;text-transform:uppercase;margin-bottom:14px}
.tracker-stats{display:flex;gap:8px}
.tstat{flex:1;padding:14px 10px;text-align:center;
  background:var(--muted);border-radius:12px;border:1px solid var(--border)}
.tstat svg.sbg{display:none}
.tstat-val{font-size:24px;font-weight:900;color:var(--foreground);letter-spacing:-.7px}
.tstat-lbl{font-size:10px;color:var(--ink3);font-weight:700;margin-top:3px;text-transform:uppercase;letter-spacing:.05em}

/* ── PROGRESS CARD (anello + stat reali, come "Potenziale" di Lovable) ──────── */
.prog-card{margin:0 20px;padding:24px;background:var(--card);
  border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow-md);
  animation:.6s cubic-bezier(.16,1,.3,1) both rise-in}
.prog-ring-wrap{position:relative;width:180px;height:180px;margin:0 auto 22px;display:flex;align-items:center;justify-content:center}
.prog-ring-wrap .blob1,.prog-ring-wrap .blob2{position:absolute;border-radius:50%;filter:blur(28px)}
.prog-ring-wrap .blob1{inset:22px;background:color-mix(in srgb,var(--primary) 22%,transparent)}
.prog-ring-wrap .blob2{inset:44px;background:color-mix(in srgb,var(--accent) 16%,transparent);animation:pulse-organic 8s ease-in-out infinite 2s}
.prog-ring{position:absolute;inset:0;transform:rotate(-90deg)}
.prog-center{position:relative;text-align:center;z-index:1}
.prog-eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--primary);margin-bottom:2px}
.prog-num{font-family:var(--font-display),sans-serif;font-size:52px;font-weight:700;color:var(--foreground);line-height:1}
.prog-num small{font-size:22px;color:var(--primary)}
.prog-sub{font-family:var(--font-mono),monospace;font-size:10px;color:var(--muted-foreground);margin-top:6px;letter-spacing:.04em}
.prog-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prog-stat{padding:16px;border-radius:16px;border:1px solid var(--border);
  background:color-mix(in srgb,var(--muted) 55%,transparent)}
.prog-stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.prog-stat-ico{font-size:18px}
.prog-stat-badge{font-size:11px;font-weight:700;color:var(--primary)}
.prog-stat-lbl{font-size:12px;font-weight:500;color:var(--muted-foreground)}
.prog-stat-val{font-family:var(--font-display),sans-serif;font-size:22px;font-weight:700;color:var(--foreground);margin-top:2px}

/* ── SESSION HERO (foto full-bleed con overlay, come "Sessione del giorno") ─── */
.session-hero{position:relative;border-radius:var(--radius-lg);overflow:hidden;
  min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;
  box-shadow:var(--shadow-md);animation:.6s cubic-bezier(.16,1,.3,1) both rise-in}
.session-hero .sh-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.session-hero .sh-ov{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(18,30,22,.88) 8%,rgba(18,30,22,.45) 45%,rgba(18,30,22,.12) 100%)}
.sh-body{position:relative;padding:26px;color:#fff}
.sh-tags{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.sh-badge{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.18);
  padding:4px 12px;border-radius:999px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;backdrop-filter:blur(4px)}
.sh-min{font-family:var(--font-mono),monospace;font-size:11px;color:rgba(255,255,255,.75)}
.sh-title{font-family:var(--font-display),sans-serif;font-size:26px;font-weight:700;line-height:1.15;margin-bottom:16px;max-width:15ch}
.sh-metrics{display:flex;gap:28px;margin-bottom:20px}
.sh-m-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.6);margin-bottom:2px}
.sh-m-v{font-size:17px;font-weight:600}
.sh-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--primary);color:var(--primary-foreground);border:none;border-radius:16px;
  padding:15px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .12s,filter .15s}
.sh-btn:active{transform:scale(.98)}
.sh-btn.done{background:rgba(255,255,255,.22);backdrop-filter:blur(4px)}

/* ── CIRCUIT (contenitore verde-tinta con righe numerate) ───────────────────── */
.circuit{margin:0 20px;padding:22px;border-radius:var(--radius-lg);
  background:color-mix(in srgb,var(--secondary) 72%,transparent);
  animation:.6s cubic-bezier(.16,1,.3,1) both rise-in}
.circuit-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.exrow{background:#fff;border:1px solid color-mix(in srgb,var(--border) 60%,#fff);border-radius:16px;overflow:hidden;margin-bottom:10px;
  box-shadow:0 1px 2px rgba(22,36,27,.05),0 6px 16px rgba(22,36,27,.05);transition:box-shadow .15s}
.exrow:last-child{margin-bottom:0}
.exrow-head{display:flex;align-items:center;gap:14px;padding:14px;cursor:pointer;text-align:left}
.exrow-num{flex-shrink:0;width:40px;height:40px;border-radius:12px;
  background:var(--secondary);color:var(--primary);
  font-family:var(--font-display),sans-serif;font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center}
.exrow-info{flex:1;min-width:0}
.exrow-name{display:block;font-family:var(--font-display),sans-serif;font-size:15px;font-weight:600;color:var(--foreground);line-height:1.25}
.exrow-sub{display:block;font-size:12.5px;color:var(--muted-foreground);margin-top:3px}
.exrow-chev{flex-shrink:0;color:var(--muted-foreground);font-size:14px;transition:transform .2s;width:20px;text-align:center}
.exrow.open .exrow-chev{transform:rotate(180deg)}
.exrow.open{background:#fff;box-shadow:0 2px 4px rgba(22,36,27,.06),0 10px 24px rgba(22,36,27,.07)}
.exrow-body{display:none;padding:0 14px 16px 68px}
.exrow.open .exrow-body{display:block}

/* ── DAY HEADER ─────────────────────────────────────────────────────────────── */
.day-header{margin-bottom:12px;padding:20px 18px;
  background:var(--card);border-radius:var(--radius-lg);border:1px solid var(--border);
  box-shadow:var(--shadow);
  animation:.7s .05s cubic-bezier(.16,1,.3,1) both rise-in}
.day-header svg.dhbg{display:none}
.day-header-title{font-size:21px;font-weight:900;color:var(--foreground);letter-spacing:-.4px}
.day-header-meta{font-size:13px;color:var(--ink3);margin-top:4px;font-weight:500}
.day-type-badge{display:inline-block;margin-top:10px}
.day-type-badge svg.dbbg{display:none}
.day-type-badge-text{font-size:11px;font-weight:800;padding:4px 12px;
  border-radius:20px;background:var(--muted);color:var(--muted-foreground);
  letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--border)}

/* ── CARDIO CARD ────────────────────────────────────────────────────────────── */
.ccard{margin-bottom:12px;padding:18px;
  background:var(--card);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow)}
.ccard svg.cbg{display:none}
.ccard-inner{position:relative;z-index:1}
.ccard-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ccard-icon{width:44px;height:44px;flex-shrink:0;border-radius:12px;background:var(--orange-l);padding:6px}
.ctag{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.ctag.run{color:var(--accent)}.ctag.walk{color:var(--blue)}
.cmetrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.cm{padding:12px;background:var(--muted);border-radius:12px;border:1px solid var(--border)}
.cm svg.cmbg{display:none}
.cm-l{font-size:10px;color:var(--ink3);font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.cm-v{font-size:18px;font-weight:800;color:var(--foreground);margin-top:2px;letter-spacing:-.3px}
.cnote{font-size:14px;color:var(--muted-foreground);line-height:1.65;margin-bottom:10px}
.cintv{position:relative}
.ci{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.ci:last-child{border-bottom:none}
.ci-l{font-size:14px;color:var(--ink3);font-weight:500}
.ci-v{font-size:14px;font-weight:700;color:var(--foreground)}

/* ── SECTION TITLE ──────────────────────────────────────────────────────────── */
.sec-title{font-size:11px;color:var(--ink3);font-weight:800;
  letter-spacing:.09em;text-transform:uppercase;margin:0 0 8px}

/* ── EXERCISE CARD ──────────────────────────────────────────────────────────── */
.ecard{margin-bottom:8px;
  background:var(--card);border-radius:var(--radius-lg);border:1px solid var(--border);
  box-shadow:var(--shadow);overflow:hidden}
.ecard svg.ebg{display:none}
.ecard-header{display:flex;align-items:center;cursor:pointer;padding:16px;gap:12px}
.esvg{flex-shrink:0;width:50px;height:50px;border-radius:12px;background:var(--muted);overflow:hidden;border:1px solid var(--border)}
.esvg-bg{display:none}
.esvg img{width:100%;height:100%;object-fit:contain;padding:7px}
.einfo{flex:1;min-width:0}
.ename{font-size:15px;font-weight:800;color:var(--foreground);line-height:1.2;margin-bottom:5px;letter-spacing:-.2px}
.emeta{display:flex;gap:5px;flex-wrap:wrap}
.etag-wrap{display:inline-block}
.etag-wrap svg.etagbg{display:none}
.etag-text{font-size:11px;padding:3px 9px;
  border-radius:20px;background:var(--muted);color:var(--ink3);font-weight:700;
  border:1px solid var(--border)}
.echevron{flex-shrink:0;font-size:14px;color:var(--ink3);transition:transform .2s;width:24px;text-align:center}
.ecard.open .echevron{transform:rotate(180deg)}
.ebody{display:none;padding:0 16px 16px;border-top:1px solid var(--border)}
.ecard.open .ebody{display:block}
.ehow{font-size:14px;color:var(--muted-foreground);line-height:1.75;margin:12px 0 14px}

/* ── SERIES ─────────────────────────────────────────────────────────────────── */
.series-label{font-size:11px;color:var(--ink3);font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px}
.series-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ser-wrap{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  background:var(--muted);border-radius:12px;transition:all .15s;border:1.5px solid var(--border)}
.ser-wrap svg.serbg{display:none}
.ser-inner{width:54px;height:54px;display:flex;align-items:center;justify-content:center;
  flex-direction:column;font-size:15px;color:var(--muted-foreground);font-weight:700}
.ser-inner.done{color:var(--primary);font-size:18px}
.ser-wrap:has(.ser-inner.done){background:var(--green-l);border-color:var(--primary)}
.ser-inner small{font-size:10px;color:var(--ink3);font-weight:500}

/* ── TIMER ──────────────────────────────────────────────────────────────────── */
.timer-wrap{margin:8px 0;cursor:pointer;
  background:var(--muted);border-radius:12px;border:1.5px solid var(--border)}
.timer-wrap svg.tmbg{display:none}
.timer-inner{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 16px}
.timer-icon{width:26px;height:26px;flex-shrink:0}
.timer-text{font-size:16px;color:var(--muted-foreground);font-weight:700}
.timer-wrap.running{border-color:var(--accent);background:var(--orange-l)}
.timer-wrap.running .timer-text{color:var(--accent);animation:pulse 1s ease-in-out infinite}
.timer-wrap.done-t{border-color:var(--primary);background:var(--green-l)}
.timer-wrap.done-t .timer-text{color:var(--primary)}

/* ── YOUTUBE LINK ───────────────────────────────────────────────────────────── */
.yt-link{display:flex;align-items:center;gap:6px;margin-top:2px;margin-bottom:12px;
  font-size:14px;color:var(--accent);text-decoration:none;font-weight:700;
  background:var(--orange-l);border-radius:12px;padding:8px 12px;width:fit-content;
  border:1px solid rgba(224,122,82,.2)}

/* ── REST CARD ──────────────────────────────────────────────────────────────── */
.rest-card{padding:0;text-align:center;margin-bottom:12px;overflow:hidden;
  background:var(--card);border-radius:var(--radius-lg);border:1px solid var(--border);
  box-shadow:var(--shadow);
  animation:.7s cubic-bezier(.16,1,.3,1) both rise-in}
.rest-card svg.restbg{display:none}
.rest-hero{width:100%;height:200px;object-fit:cover;object-position:center 30%;display:block}
.rest-title{font-size:22px;font-weight:900;color:var(--foreground);margin:20px 0 6px;letter-spacing:-.5px}
.rest-sub{font-size:14px;color:var(--ink3);font-weight:500;padding-bottom:24px}
/* Day header hero */
.day-hero{width:100%;height:180px;object-fit:cover;border-radius:var(--radius-lg);margin-bottom:12px;display:block}

/* ── COMPLETE BTN ───────────────────────────────────────────────────────────── */
.complete-wrap{margin-top:16px;cursor:pointer;border-radius:var(--radius-lg);overflow:hidden;transition:all .2s}
.complete-wrap svg.cbtnbg{display:none}
.complete-text{font-size:17px;font-weight:800;text-align:center;padding:18px;letter-spacing:-.1px}
.complete-wrap.active{background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 78%,#000));box-shadow:0 4px 20px color-mix(in srgb,var(--primary) 35%,transparent)}
.complete-wrap.active .complete-text{color:#fff}
.complete-wrap.inactive{background:var(--muted);border:1px solid var(--border)}
.complete-wrap.inactive .complete-text{color:var(--ink3)}
.complete-wrap.completed{background:var(--green-l);border:2px solid var(--primary)}
.complete-wrap.completed .complete-text{color:var(--primary)}

/* ── DASHBOARD STATS ────────────────────────────────────────────────────────── */
.dash-stat{background:var(--card);border-radius:14px;padding:16px;text-align:center;
  border:1px solid var(--border);box-shadow:var(--shadow)}
.dash-val{font-size:26px;font-weight:900;letter-spacing:-.7px;color:var(--foreground)}
.dash-lbl{font-size:10px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}

/* ── TOAST ──────────────────────────────────────────────────────────────────── */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--foreground);color:#fff;padding:10px 20px;border-radius:40px;
  font-size:14px;font-weight:700;
  box-shadow:0 8px 32px rgba(45,62,53,.25);
  opacity:0;transition:all .3s;pointer-events:none;z-index:100;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

// ─── STATE ───────────────────────────────────────────────────────────────────
const KEYS={
  completed:'marco_training_completed_v1',
  serDone:'marco_training_serDone_v1',
  startDate:'marco_training_startDate_v1',    // data inizio piano (ISO string)
  weekDone:'marco_training_weekDone_v1'        // {fase-sett-giorno: bool}
};

// Fasi: 4 settimane ciascuna = 13 settimane totali (4+4+5 come da piano)
const PHASE_WEEKS=[4,4,5]; // settimane per fase
const TOTAL_WEEKS=13;

let cP=0,cD=0,cW=0; // fase corrente, giorno corrente, settimana corrente (0-based dentro la fase)

// completed[fase][settimana][giorno] = bool
// Struttura: 3 fasi × max 5 settimane × 7 giorni
function emptyCompleted(){
  return PHASE_WEEKS.map(w=>Array.from({length:w},()=>Array(7).fill(false)));
}
function emptySerDone(){
  // [fase][settimana][giorno][esercizio][serie] = bool
  return PHASE_WEEKS.map((_,pi)=>
    Array.from({length:PHASE_WEEKS[pi]},(_,wi)=>
      phases[pi].days.map(d=>d.ex.map(e=>Array(e.sets).fill(false)))
    )
  );
}

let startDate=localStorage.getItem(KEYS.startDate)||null; // null = non impostata
let completed=JSON.parse(localStorage.getItem(KEYS.completed)||'null')||emptyCompleted();
let serDone=JSON.parse(localStorage.getItem(KEYS.serDone)||'null')||emptySerDone();

// Calcola fase e settimana corrente dalla data di inizio
function calcCurrentWeek(){
  if(!startDate)return{phase:0,week:0};
  const start=new Date(startDate);
  start.setHours(0,0,0,0);
  const now=new Date();
  now.setHours(0,0,0,0);
  const daysDiff=Math.floor((now-start)/86400000);
  const weekNum=Math.min(Math.floor(daysDiff/7),TOTAL_WEEKS-1);
  let cum=0;
  for(let p=0;p<PHASE_WEEKS.length;p++){
    if(weekNum<cum+PHASE_WEEKS[p])return{phase:p,week:weekNum-cum};
    cum+=PHASE_WEEKS[p];
  }
  return{phase:2,week:PHASE_WEEKS[2]-1};
}

function saveState(){
  try{
    localStorage.setItem(KEYS.completed,JSON.stringify(completed));
    localStorage.setItem(KEYS.serDone,JSON.stringify(serDone));
    if(startDate)localStorage.setItem(KEYS.startDate,startDate);
  }catch(e){}
}

// Migrazione dati vecchi (struttura piatta → struttura settimane)
(function migrate(){
  try{
    const oldC=localStorage.getItem('mco_completed');
    const oldS=localStorage.getItem('mco_serDone');
    if(oldC){localStorage.removeItem('mco_completed');}
    if(oldS){localStorage.removeItem('mco_serDone');}
  }catch(e){}
})();

// Normalizza arrays (in caso di aggiornamento struttura)
function initState(){
  PHASE_WEEKS.forEach((w,pi)=>{
    while(completed[pi].length<w)completed[pi].push(Array(7).fill(false));
    while(serDone[pi].length<w)
      serDone[pi].push(phases[pi].days.map(d=>d.ex.map(e=>Array(e.sets).fill(false))));
    completed[pi].forEach((wk,wi)=>{
      while(wk.length<7)wk.push(false);
    });
  });
}
initState();

// Imposta settimana corrente dalla data
const cur=calcCurrentWeek();
cP=cur.phase;cW=cur.week;cD=0;

// ─── AUDIO BEEP (Web Audio API) ──────────────────────────────────────────────
let audioCtx=null;
function getAudio(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function beep(freq,dur,vol,delay){
  try{
    const ctx=getAudio();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.type='sine';osc.frequency.value=freq||880;
    const t=ctx.currentTime+(delay||0);
    gain.gain.setValueAtTime(0,t);
    gain.gain.linearRampToValueAtTime(vol||0.4,t+0.01);
    gain.gain.linearRampToValueAtTime(0,t+(dur||0.08));
    osc.start(t);osc.stop(t+(dur||0.08)+0.05);
  }catch(e){}
}
function beepStart(){beep(660,0.06,0.25,0);}
function beepDone(){beep(660,0.4,0.5,0);}

// ─── NOTIFICATION API — per segnale con schermo spento ───────────────────────
let notifPermission='default';
let pendingNotifTimeout=null; // setTimeout per la notifica schedulata

async function requestNotifPermission(){
  if(!('Notification' in window))return;
  if(Notification.permission==='granted'){notifPermission='granted';return;}
  if(Notification.permission==='denied'){notifPermission='denied';return;}
  try{
    const result=await Notification.requestPermission();
    notifPermission=result;
  }catch(e){}
}

function scheduleNotif(sec,title,body){
  // Cancella eventuale notifica precedente
  cancelPendingNotif();
  if(notifPermission!=='granted')return;
  // Schedula la notifica esatta alla fine del timer
  pendingNotifTimeout=setTimeout(()=>{
    try{
      new Notification(title,{
        body,
        icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><text y="50" font-size="52">⏱</text></svg>',
        badge:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><text y="50" font-size="52">⏱</text></svg>',
        requireInteraction:false,
        silent:false
      });
    }catch(e){}
    pendingNotifTimeout=null;
  },sec*1000);
}

function cancelPendingNotif(){
  if(pendingNotifTimeout){clearTimeout(pendingNotifTimeout);pendingNotifTimeout=null;}
}

// ─── STATO TIMER ─────────────────────────────────────────────────────────────
let activeTimer={int:null,key:null,type:null};

function clearActiveTimer(){
  if(activeTimer.int){clearInterval(activeTimer.int);activeTimer.int=null;}
  cancelPendingNotif();
  activeTimer.key=null;activeTimer.type=null;
}

function resetTimerUI(key,type,defaultText){
  const el=document.getElementById((type==='rec'?'rec-':'exec-')+key);
  if(el){el.className='timer-wrap';const t=el.querySelector('.timer-text');if(t)t.textContent=defaultText;}
}

// ─── TIMER RECUPERO ──────────────────────────────────────────────────────────
function startRecTimer(sec,key){
  const wrap=document.getElementById('rec-'+key);
  if(!wrap)return;
  if(activeTimer.key===key&&activeTimer.type==='rec'){
    clearActiveTimer();
    wrap.className='timer-wrap';
    wrap.querySelector('.timer-text').textContent='⏱ Avvia recupero ('+sec+'s)';
    return;
  }
  if(activeTimer.key){resetTimerUI(activeTimer.key,activeTimer.type,activeTimer.type==='rec'?'⏱ Avvia recupero':'▶ Avvia timer');}
  clearActiveTimer();

  // Sblocca AudioContext (richiede gesto utente — lo abbiamo qui)
  try{if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}catch(e){}

  let remain=sec;
  activeTimer={int:null,key,type:'rec'};
  beepStart();

  // Schedula notifica per quando lo schermo è spento
  scheduleNotif(sec,'⏱ Recupero finito!','Pronto per la prossima serie 💪');

  wrap.className='timer-wrap running';
  function tick(){
    if(remain<=3&&remain>0){beep(1000,0.07,0.25,0);}
    if(remain<=0){
      clearActiveTimer();beepDone();
      wrap.className='timer-wrap done-t';
      wrap.querySelector('.timer-text').textContent='✓ Recupero finito!';
      try{if('vibrate'in navigator)navigator.vibrate([200,100,200]);}catch(e){}
      return;
    }
    const m=Math.floor(remain/60),s=remain%60;
    wrap.querySelector('.timer-text').textContent=`⏸ ${m}:${s.toString().padStart(2,'0')} — tocca per fermare`;
    remain--;
  }
  tick();activeTimer.int=setInterval(tick,1000);
}

// ─── TIMER ESECUZIONE (isometrici) ───────────────────────────────────────────
function startExecTimer(sec,key){
  const wrap=document.getElementById('exec-'+key);
  if(!wrap)return;
  if(activeTimer.key===key&&activeTimer.type==='exec'){
    clearActiveTimer();
    wrap.className='timer-wrap';
    wrap.querySelector('.timer-text').textContent='▶ Avvia timer ('+sec+'s)';
    return;
  }
  if(activeTimer.key){resetTimerUI(activeTimer.key,activeTimer.type,activeTimer.type==='rec'?'⏱ Avvia recupero':'▶ Avvia timer');}
  clearActiveTimer();

  try{if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}catch(e){}

  let remain=sec;
  activeTimer={int:null,key,type:'exec'};
  beepStart();

  // Notifica per schermo spento — con il nome dell'esercizio se disponibile
  scheduleNotif(sec,'✅ Serie completata!','Ottimo! Avvia il recupero quando sei pronto.');

  wrap.className='timer-wrap exec-running';
  function tick(){
    if(remain<=3&&remain>0){beep(1100,0.07,0.3,0);}
    if(remain<=0){
      clearActiveTimer();beepDone();
      wrap.className='timer-wrap done-t';
      wrap.querySelector('.timer-text').textContent='✓ Serie completata!';
      try{if('vibrate'in navigator)navigator.vibrate([300]);}catch(e){}

    wrap.querySelector('.timer-text').textContent=`🔥 ${m}:${s.toString().padStart(2,'0')} — tieni!`;
    remain--;
  }
  tick();activeTimer.int=setInterval(tick,1000);
}

// Metriche reali del piano (nessun dato finto)
function planMetrics(){
  const weekDays=completed[cP][cW]||Array(7).fill(false);
  const weekDone=weekDays.filter(Boolean).length;
  let totalDone=0,totalSess=0;
  completed.forEach(ph=>ph.forEach(wk=>wk.forEach(v=>{totalSess++;if(v)totalDone++;})));
  const pct=Math.round(totalDone/totalSess*100)||0;
  const globalW=PHASE_WEEKS.slice(0,cP).reduce((a,b)=>a+b,0)+cW+1;
  return{weekDone,totalDone,totalSess,pct,globalW};
}

function toggleSer(pi,di,ei,si){
  if(!serDone[pi][cW])serDone[pi][cW]=phases[pi].days.map(d=>d.ex.map(e=>Array(e.sets).fill(false)));
  if(!serDone[pi][cW][di])serDone[pi][cW][di]=phases[pi].days[di].ex.map(e=>Array(e.sets).fill(false));
  while(serDone[pi][cW][di][ei].length<=si)serDone[pi][cW][di][ei].push(false);
  serDone[pi][cW][di][ei][si]=!serDone[pi][cW][di][ei][si];
  saveState();
  renderMain();
  const key=`${pi}-${di}-${ei}`;
  setTimeout(()=>{const el=document.getElementById('ec-'+key);if(el)el.classList.add('open');},10);
}

function toggleComplete(){
  if(!completed[cP][cW])completed[cP][cW]=Array(7).fill(false);
  completed[cP][cW][cD]=!completed[cP][cW][cD];
  saveState();
  if(completed[cP][cW][cD])showToast('Sessione completata! 💪');
  renderMain();
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function selP(i){cP=i;cW=0;cD=0;renderMain();}
function selD(i){cD=i;renderMain();}
function selW(delta){
  let g=PHASE_WEEKS.slice(0,cP).reduce((a,b)=>a+b,0)+cW+delta; // 0-based global
  g=Math.max(0,Math.min(TOTAL_WEEKS-1,g));
  let acc=0,ph=0;
  for(ph=0;ph<PHASE_WEEKS.length;ph++){if(g<acc+PHASE_WEEKS[ph])break;acc+=PHASE_WEEKS[ph];}
  cP=ph;cW=g-acc;if(cD>=phases[cP].days.length)cD=0;
  renderMain();
}

function calcStreak(){
  // Conta giorni consecutivi con almeno una sessione completata
  if(!startDate)return 0;
  const start=new Date(startDate);
  let streak=0,d=new Date();
  d.setHours(0,0,0,0);
  for(let i=0;i<84;i++){
    const dayNum=Math.floor((d-start)/86400000);
    if(dayNum<0)break;
    const wk=Math.floor(dayNum/7);
    const dy=dayNum%7;
    const ph=PHASE_WEEKS.findIndex((_,idx)=>{
      const s=PHASE_WEEKS.slice(0,idx).reduce((a,b)=>a+b,0);
      return wk>=s&&wk<s+PHASE_WEEKS[idx];
    });
    const localW=ph>=0?wk-PHASE_WEEKS.slice(0,ph).reduce((a,b)=>a+b,0):0;
    if(ph>=0&&completed[ph][localW]&&completed[ph][localW][dy]){streak++;}
    else if(i>0)break;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

  const q=QUOTES[Math.floor(Math.random()*QUOTES.length)];
  document.getElementById('splashQuote').textContent=q;

  if(!startDate){
    document.getElementById('dashMain').style.display='none';
    document.getElementById('datePickerSection').style.display='block';
    return;
  }
  document.getElementById('dashMain').style.display='block';
  document.getElementById('datePickerSection').style.display='none';

  const globalW=PHASE_WEEKS.slice(0,cP).reduce((a,b)=>a+b,0)+cW+1;
  const endDate=new Date(startDate);
  endDate.setDate(endDate.getDate()+91);

  let totalDone=0,totalSess=0;
  completed.forEach(ph=>ph.forEach(wk=>wk.forEach(v=>{totalSess++;if(v)totalDone++;})));
  const pct=Math.round(totalDone/totalSess*100)||0;

  const weekDays=completed[cP][cW]||Array(7).fill(false);
  const weekDone=weekDays.filter(Boolean).length;
  const streak=calcStreak();

  // Barra progresso settimane
  const bars=Array.from({length:TOTAL_WEEKS},(_,i)=>{
    const isActive=i===globalW-1;
    const ph=PHASE_WEEKS.findIndex((_,idx)=>i<PHASE_WEEKS.slice(0,idx+1).reduce((a,b)=>a+b,0));
    const localW=i-PHASE_WEEKS.slice(0,ph).reduce((a,b)=>a+b,0);
    const done=ph>=0&&completed[ph][localW]&&completed[ph][localW].filter(Boolean).length>0;
    const colors=['#9b87c0','#ee7f66','#6aac87'];
    const col=colors[Math.max(0,ph)];
    return`<div style="flex:1;height:6px;border-radius:3px;margin:1px;
      background:${done?col:isActive?col+'66':'rgba(0,0,0,0.08)'};
      ${isActive?'box-shadow:0 0 0 1px '+col:''}" title="Sett. ${i+1}"></div>`;
  }).join('');

  document.getElementById('dashMain').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
      <div class="dash-stat"><div class="dash-val" style="color:var(--green)">${totalDone}</div><div class="dash-lbl">Sessioni completate</div></div>
      <div class="dash-stat"><div class="dash-val" style="color:var(--purple)">${pct}%</div><div class="dash-lbl">Piano completato</div></div>
      <div class="dash-stat"><div class="dash-val" style="color:var(--orange)">${weekDone}/7</div><div class="dash-lbl">Questa settimana</div></div>
      <div class="dash-stat"><div class="dash-val" style="color:var(--blue)">${streak}</div><div class="dash-lbl">Giorni di streak</div></div>
    </div>
    <div style="font-size:11px;color:var(--ink3);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.06em">
      Sett. ${globalW}/${TOTAL_WEEKS} · ${phases[cP].label} · Fine: ${endDate.toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'})}
    </div>
    <div style="display:flex;gap:2px;margin-bottom:4px">${bars}</div>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--ink3);font-weight:600">
      <span>Fase 1</span><span>Fase 2</span><span>Fase 3</span>
    </div>`;
}

function setStartDate(){
  const input=document.getElementById('startDateInput');
  if(!input.value)return;
  startDate=input.value;
  saveState();
  const cur2=calcCurrentWeek();
  cP=cur2.phase;cW=cur2.week;cD=0;
  buildDashboard();
}

function enterApp(){
  document.getElementById('splash').classList.add('hidden');
  document.getElementById('app').style.visibility='visible';
  requestNotifPermission();
}

// ─── INIT ────────────────────────────────────────────────────────────────────
renderMain();buildDashboard();

</script>
</body>
</html>
